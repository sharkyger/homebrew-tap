name: tap tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Disable Homebrew's Linux build sandbox in CI.
#
# Homebrew now mandates a bubblewrap-based sandbox for `--build-from-source`
# / `--HEAD` builds on Linux. GitHub's `ubuntu-latest` (24.04) ships with
# `kernel.apparmor_restrict_unprivileged_userns=1`, which blocks rootless
# `bwrap` from creating a user namespace, so every Linux build of safe-fetch
# fails with "Bubblewrap is required to use the Linux sandbox but was not
# found." (macOS uses sandbox-exec and is unaffected.)
#
# This var is the workaround Homebrew's own error message recommends. It
# only touches the build-time sandbox in the ephemeral CI runner — it does
# not affect what users install. The `_LINUX` suffix makes it a no-op on the
# macOS jobs, so a single top-level env cleanly targets only the Linux legs.
# Verified locally: a clean container build needs no workaround; this is
# specific to AppArmor-locked hosts like the runner.
env:
  HOMEBREW_NO_SANDBOX_LINUX: 1
  # macos-latest rolled out a runner image (post-2026-06-10) whose
  # sandbox-exec profile breaks Homebrew's `--build-from-source` / `--HEAD`
  # build step: `sandbox-exec -f …/homebrew.sb … build.rb … exited with 1`,
  # failing both macOS jobs on UNCHANGED formulae (e.g. safe-fetch v0.3.0).
  # This is the macOS analogue of the Linux bwrap breakage documented above
  # (fixed in #13). HOMEBREW_NO_SANDBOX disables the build sandbox on all
  # platforms — a superset of the _LINUX var (kept above for history). Like
  # that var, it only touches the build-time sandbox in the ephemeral CI
  # runner; it does not affect what users install.
  HOMEBREW_NO_SANDBOX: 1

jobs:
  test-bot:
    name: brew test-bot (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-
      - name: brew test-bot --only-cleanup-before
        run: brew test-bot --only-cleanup-before
      - name: brew test-bot --only-setup
        run: brew test-bot --only-setup
      - name: brew test-bot --only-tap-syntax
        run: brew test-bot --only-tap-syntax

  install-smoke:
    # End-to-end: tap from this repo (the published GitHub remote, which
    # matches our checkout) → install --HEAD → run installer in tmpdir →
    # uninstall. --HEAD so the smoke works before the v1.0.0 tag exists.
    name: install smoke (macos, --HEAD)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Tap sharkyger/tap from GitHub
        # Tap from the published URL so brew doesn't refuse with
        # "remote mismatch" (it pins the tap dir to a specific remote).
        run: brew tap sharkyger/tap https://github.com/sharkyger/homebrew-tap
      - name: brew install --HEAD safe-fetch
        run: brew install --HEAD safe-fetch
      - name: safe-fetch --version
        run: safe-fetch --version
      - name: Install hooks into tmp target
        run: |
          mkdir -p /tmp/smoke-claude
          safe-fetch --install-claude-hooks --install-target /tmp/smoke-claude
          test -f /tmp/smoke-claude/hooks/injection-gate-bash.sh
          test -f /tmp/smoke-claude/commands/save-memory.md
          test -f /tmp/smoke-claude/CLAUDE.md
          test -f /tmp/smoke-claude/settings.json
          grep -q "safe-fetch:hook-snippet:begin" /tmp/smoke-claude/CLAUDE.md
      - name: Idempotency
        run: |
          safe-fetch --install-claude-hooks --install-target /tmp/smoke-claude
          out=$(safe-fetch --install-claude-hooks --install-target /tmp/smoke-claude)
          echo "$out" | grep -v "skip" && (echo "non-skip action on re-install"; exit 1) || true
      - name: Uninstall
        run: |
          safe-fetch --uninstall-claude-hooks --install-target /tmp/smoke-claude
          test ! -f /tmp/smoke-claude/hooks/injection-gate-bash.sh
          test ! -f /tmp/smoke-claude/commands/save-memory.md

  install-smoke-linux:
    # Catches Linuxbrew-specific build issues. v0.1.3 was specifically
    # opened to fix lxml install on Linuxbrew (sdist build segfaulted on
    # current toolchain); without this Linux job that bug shipped to
    # users silently because the macOS smoke didn't hit it.
    name: install smoke (linux, --HEAD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Tap sharkyger/tap from GitHub
        run: brew tap sharkyger/tap https://github.com/sharkyger/homebrew-tap
      - name: brew install --HEAD safe-fetch
        run: brew install --HEAD safe-fetch
      - name: safe-fetch --version
        run: safe-fetch --version
      - name: Install hooks into tmp target (exercises lxml + bs4 load)
        run: |
          mkdir -p /tmp/smoke-claude
          safe-fetch --install-claude-hooks --install-target /tmp/smoke-claude
          test -f /tmp/smoke-claude/hooks/injection-gate-bash.sh
          test -f /tmp/smoke-claude/commands/save-memory.md
          test -f /tmp/smoke-claude/CLAUDE.md
      - name: Uninstall
        run: |
          safe-fetch --uninstall-claude-hooks --install-target /tmp/smoke-claude
          test ! -f /tmp/smoke-claude/hooks/injection-gate-bash.sh

  install-from-tag:
    # Exercises the FORMULA's tagged url + sha256 + resources path,
    # not --HEAD. --HEAD bypasses the resource pins; this job is the
    # one that catches "wheel URL went stale" / "lxml resource broken"
    # bugs that --HEAD silently dodges. Runs on both macOS + Linux.
    name: install from tag (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Tap sharkyger/tap from GitHub
        run: brew tap sharkyger/tap https://github.com/sharkyger/homebrew-tap
      - name: brew install --build-from-source safe-fetch (from formula tag)
        run: brew install --build-from-source sharkyger/tap/safe-fetch
      - name: safe-fetch --version
        run: safe-fetch --version
      - name: brew test safe-fetch
        run: brew test sharkyger/tap/safe-fetch
